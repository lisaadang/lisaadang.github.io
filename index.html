<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f6f2">
    <meta name="description" content="The personal website of Lisa Adang.">
    <title>Lisa Adang — Personal Website</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #242a29;
        background: #f7f6f2;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        display: grid;
        grid-template-rows: auto 1fr auto;
      }

      a {
        color: inherit;
      }

      .site-header,
      .site-footer {
        width: min(100% - 3rem, 1120px);
        margin-inline: auto;
      }

      .site-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-block: 1.75rem;
      }

      .wordmark {
        font-size: 1rem;
        font-weight: 700;
        letter-spacing: -0.03em;
        text-decoration: none;
      }

      .header-link,
      .text-link {
        font-size: 0.9rem;
        text-decoration-thickness: 1px;
        text-underline-offset: 0.25em;
      }

      main {
        width: min(100% - 3rem, 1120px);
        margin-inline: auto;
        display: flex;
        align-items: center;
        padding-block: 5rem;
      }

      .intro {
        max-width: 760px;
      }

      .eyebrow {
        margin: 0 0 1.5rem;
        color: #63736a;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 700px;
        margin: 0;
        font-size: clamp(3.5rem, 10vw, 7.5rem);
        font-weight: 600;
        letter-spacing: -0.075em;
        line-height: 0.98;
      }

      .description {
        max-width: 520px;
        margin: 2rem 0 0;
        color: #59615e;
        font-size: clamp(1.05rem, 2vw, 1.25rem);
        line-height: 1.7;
      }

      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 1.5rem;
        margin-top: 2rem;
      }

      .text-link {
        font-weight: 600;
      }

      .site-footer {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        padding-block: 1.5rem;
        border-top: 1px solid #deded7;
        color: #69716d;
        font-size: 0.8rem;
      }

      .site-footer p {
        margin: 0;
      }

      a:focus-visible {
        outline: 2px solid #63736a;
        outline-offset: 4px;
      }

      @media (max-width: 480px) {
        .site-header,
        .site-footer,
        main {
          width: min(100% - 2rem, 1120px);
        }

        main {
          padding-block: 3.5rem;
        }

        .site-footer {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <a class="wordmark" href="/" aria-label="Lisa Adang home">Lisa Adang</a>
      <a class="header-link" href="https://github.com/lisaadang">GitHub</a>
    </header>
    <main>
      <section class="intro" aria-labelledby="intro-title">
        <p class="eyebrow">Personal website</p>
        <h1 id="intro-title">Hello, I’m Lisa.</h1>
        <p class="description">
          Welcome to my corner of the internet. This is a place to share a little about me and what I’m working on.
        </p>
        <div class="links">
          <a class="text-link" href="https://github.com/lisaadang">Find me on GitHub ↗</a>
        </div>
      </section>
    </main>
    <footer class="site-footer">
      <p>© <span id="year">2026</span> Lisa Adang</p>
      <p>Made with care.</p>
    </footer>
    <script>
      document.getElementById("year").textContent = new Date().getFullYear();
    </script>
  </body>
</html>
